[project]
name = "jobhunt-mcp"
version = "0.1.0"
description = "Alexa+ Job Hunt Assistant: an MCP server that tracks job applications and reads recruiter replies from Gmail"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
jobhunt-mcp = "jobhunt_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
